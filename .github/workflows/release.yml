name: Build release branch VSIX

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch-vsix
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Test, package, and upload
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Prepare rolling release asset
        shell: bash
        run: |
          VSIX_PATH=$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)
          test -n "$VSIX_PATH"
          cp "$VSIX_PATH" remote-local-network-share-latest.vsix

      - name: Update rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-branch-latest
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

          RELEASE_NOTES="Automated VSIX build from release branch commit ${GITHUB_SHA}."

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "Latest release branch build" \
              --notes "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "Latest release branch build" \
              --notes "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false
          fi

          gh release upload "${RELEASE_TAG}" \
            remote-local-network-share-latest.vsix \
            --clobber
